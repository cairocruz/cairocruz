name: Gerar terminal

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia: atualiza grafo, stats e data do login
  workflow_dispatch:
  push:
    branches: [main, terminal-preview]
    paths: ["terminal/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python terminal/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A README.md assets/term
          git diff --cached --quiet || git commit -m "Atualiza terminal"
          git push
